
name: FM1 CI ER054 Completion Reporter

on:
  workflow_run:
    workflows:
      - FM1 CI ER054 License Policy Test
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  report-ci-result:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Download license evaluation evidence
        uses: actions/download-artifact@v4
        with:
          name: fm1-er054-license-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: er054-evidence

      - name: Verify license policy and report ER-054 to ZeroUI
        shell: bash
        env:
          FM1_URL: ${{ vars.FM1_PUBLIC_BASE_URL }}
          FM1_TOKEN: ${{ secrets.FM1_SIGNAL_INTAKE_AUTH_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TENANT_ID: ${{ vars.FM1_TENANT_ID }}
          RELEASE_ID: ${{ vars.FM1_RELEASE_ID }}
          RECHECK_BLOCKER_ID: ${{ vars.FM1_ER054_RECHECK_BLOCKER_ID }}
          RECHECK_EVENT_ID: ${{ vars.FM1_ER054_RECHECK_EVENT_ID }}
          TARGET_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TARGET_NAME: ${{ github.event.workflow_run.name }}
          TARGET_TITLE: ${{ github.event.workflow_run.display_title }}
          TARGET_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit

          def required(key):
              value = os.environ.get(key, '').strip()
              if not value:
                  raise SystemExit(f'Missing required setting: {key}')
              return value

          repo = required('TARGET_REPO')
          if repo != required('GITHUB_REPOSITORY'):
              raise SystemExit('GitHub source repository mismatch')
          run_id = required('TARGET_RUN_ID')
          attempt = required('TARGET_ATTEMPT')
          sha = required('TARGET_SHA')
          proof = Path('er054-evidence')
          summary = json.loads((proof / 'summary.json').read_text(encoding='utf-8'))
          metadata_path = proof / 'pyproject.toml'
          policy_path = proof / 'fixture-policy.json'
          if summary.get('schema') != 'zeroui.er054.license_evidence.v1':
              raise SystemExit('Incorrect license-evidence schema')
          mode = summary.get('mode')
          if mode not in {'deny', 'pass'}:
              raise SystemExit('Unexpected test mode')
          if (summary.get('run_id') != run_id or
                  str(summary.get('run_attempt')) != attempt or
                  summary.get('commit_sha') != sha):
              raise SystemExit('Evidence belongs to another GitHub run or commit')
          if required('TARGET_TITLE') != f'ER054 {mode} license fixture':
              raise SystemExit('Workflow run title does not match measured mode')
          if summary.get('evaluation_scope') != 'controlled_package_metadata_fixture':
              raise SystemExit('Unexpected evidence scope')
          if summary.get('metadata_sha256') != hashlib.sha256(metadata_path.read_bytes()).hexdigest():
              raise SystemExit('Package metadata hash does not match evidence')
          if summary.get('policy_sha256') != hashlib.sha256(policy_path.read_bytes()).hexdigest():
              raise SystemExit('Fixture policy hash does not match evidence')

          metadata = tomllib.loads(metadata_path.read_text(encoding='utf-8'))
          license_id = metadata['project']['license']
          policy = json.loads(policy_path.read_text(encoding='utf-8'))
          if (not isinstance(license_id, str) or
                  policy.get('schema') != 'zeroui.er054.fixture_license_policy.v1' or
                  policy.get('scope') != 'controlled_fixture_not_tenant_policy'):
              raise SystemExit('Invalid package or fixture policy metadata')
          allowed = set(policy['allowed_license_ids'])
          denied = set(policy['denied_license_ids'])
          if (allowed != {'MIT', 'Apache-2.0'} or denied != {'GPL-3.0'} or
                  allowed & denied or license_id not in allowed | denied):
              raise SystemExit('Unexpected fixture license policy')
          verdict = 'denied' if license_id in denied else 'allowed'
          if (summary.get('license_id') != license_id or
                  summary.get('policy_verdict') != verdict or
                  summary.get('license_policy_failed') != (verdict == 'denied')):
              raise SystemExit('Evidence summary does not match source license evaluation')
          if mode == 'deny' and (license_id != 'GPL-3.0' or verdict != 'denied'):
              raise SystemExit('No denied-license condition observed')
          if mode == 'pass' and (license_id != 'MIT' or verdict != 'allowed'):
              raise SystemExit('Allowed-license recovery was not demonstrated')

          jobs_url = (f'https://api.github.com/repos/{repo}/actions/runs/'
                      f'{run_id}/attempts/{attempt}/jobs?per_page=100')
          jobs_request = urllib.request.Request(jobs_url, headers={
              'Authorization': 'Bearer ' + required('GH_API_TOKEN'),
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ZeroUI-ER054-Reporter',
          })
          try:
              with urllib.request.urlopen(jobs_request, timeout=30) as response:
                  job_data = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'GitHub job evidence lookup HTTP {exc.code}') from None
          except urllib.error.URLError as exc:
              raise SystemExit(f'GitHub job evidence unavailable: {type(exc.reason).__name__}') from None
          jobs = job_data.get('jobs')
          if not isinstance(jobs, list) or job_data.get('total_count') != 1:
              raise SystemExit('Expected exactly one source license evaluation job')
          job = jobs[0]
          if (job.get('name') != 'FM1 ER054 License Evaluation' or
                  job.get('status') != 'completed' or job.get('conclusion') != 'success'):
              raise SystemExit('Source license evaluation job was not successful')
          steps = {step['name']: step['conclusion'] for step in job.get('steps', [])}
          if (steps.get('Evaluate declared package license') != 'success' or
                  steps.get('Upload license evaluation evidence') != 'success'):
              raise SystemExit('Source license evaluation or artifact upload failed')

          base = required('FM1_URL').rstrip('/')
          url = urlsplit(base)
          if (url.scheme != 'https' or not url.hostname or url.username or
                  url.password or url.path not in ('', '/') or url.query or url.fragment):
              raise SystemExit('FM1 endpoint must be an HTTPS origin')
          print('Verified package license:', license_id)
          print('Verified fixture policy verdict:', verdict)
          print('Mode:', mode)
          event_id = f'github-ci-er054-{run_id}-{attempt}-{job["id"]}'
          payload = {
              'license_id': license_id,
              'policy_verdict': verdict,
              'license_policy_failed': verdict == 'denied',
              'license_policy_scope': 'controlled_package_metadata_fixture',
              'license_policy_source': 'fixture_policy_not_tenant_policy',
              'policy_check_family': 'dependency_license_policy',
              'scan_passed': verdict == 'allowed',
              'workflow_completed': True,
              'workflow_run_id': run_id,
              'workflow_run_url': required('TARGET_URL'),
              'job_id': job['id'],
              'job_url': job.get('html_url'),
          }
          if mode == 'pass':
              payload.update({
                  'ci_recheck': True,
                  'recheck_of_blocker_id': required('RECHECK_BLOCKER_ID'),
                  'recheck_of_normalized_event_id': required('RECHECK_EVENT_ID'),
                  'recheck_reason': 'declared_license_now_allowed_under_fixture_policy',
              })
          signal = {
              'schema_version': '1',
              'event_type_id': 'ci.license_policy.failed',
              'source_system': 'ci_cd',
              'signal_method': 'pipeline_job',
              'provider': 'github_actions',
              'tenant_id': required('TENANT_ID'),
              'release_key': required('RELEASE_ID'),
              'release_id': required('RELEASE_ID'),
              'repository': repo,
              'branch': required('TARGET_BRANCH'),
              'commit_hash': sha,
              'trace_id': event_id,
              'source_event_id': event_id,
              'workflow_run_id': run_id,
              'run_id': run_id,
              'pipeline_id': run_id,
              'workflow_name': required('TARGET_NAME'),
              'payload': payload,
              'raw_metadata': {
                  'ci_runner_marker': 'github_actions',
                  'ci_runner_detected': True,
              },
          }
          request = urllib.request.Request(
              base + '/fm1/v1/ci/signals',
              data=json.dumps(signal).encode('utf-8'),
              headers={
                  'Content-Type': 'application/json',
                  'X-FM1-Signal-Intake-Auth-Token': required('FM1_TOKEN'),
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
                  print('FM1 HTTP status:', response.status)
          except urllib.error.HTTPError as exc:
              print('FM1 HTTP status:', exc.code)
              raise SystemExit('FM1 rejected ER-054 license signal') from None
          except urllib.error.URLError as exc:
              raise SystemExit(f'FM1 endpoint unavailable: {type(exc.reason).__name__}') from None
          for key in (
              'accepted', 'ingest_status', 'routing_status', 'mapped_trigger_id',
              'decision_status', 'decision_outcome', 'normalized_event_id',
              'blocker_id', 'receipt_ref', 'reason_code',
          ):
              print(f'{key}: {result.get(key)}')
          if result.get('accepted') is not True or result.get('mapped_trigger_id') != 'ER-054':
              raise SystemExit('Incorrect ER-054 event routing')
          if result.get('decision_status') != 'decided' or not result.get('receipt_ref'):
              raise SystemExit('Missing F13 decision or receipt')
          outcome = result.get('decision_outcome')
          if mode == 'deny' and outcome != 'hard_block':
              raise SystemExit('Expected ER-054 hard_block did not occur; inspect active policy')
          if mode == 'pass' and outcome != 'pass':
              raise SystemExit('Allowed-license recovery did not pass F13 policy')
          print('ER-054 intake, decision and receipt verified; inspect blocker in portal')
          PY
