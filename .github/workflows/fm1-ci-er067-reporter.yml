
name: FM1 CI ER067 Completion Reporter

on:
  workflow_run:
    workflows:
      - FM1 CI ER067 Failed Test
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  report-ci-result:
    if: >-
      ${{
        (github.event.workflow_run.conclusion == 'failure' ||
         github.event.workflow_run.conclusion == 'success') &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest

    steps:
      - name: Verify failed test and report ER067 to ZeroUI
        shell: bash
        env:
          FM1_URL: ${{ vars.FM1_PUBLIC_BASE_URL }}
          FM1_TOKEN: ${{ secrets.FM1_SIGNAL_INTAKE_AUTH_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TENANT_ID: ${{ vars.FM1_TENANT_ID }}
          RELEASE_ID: ${{ vars.FM1_RELEASE_ID }}
          RECHECK_BLOCKER_ID: ${{ vars.FM1_ER067_RECHECK_BLOCKER_ID }}
          RECHECK_EVENT_ID: ${{ vars.FM1_ER067_RECHECK_EVENT_ID }}
          TARGET_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TARGET_NAME: ${{ github.event.workflow_run.name }}
          TARGET_URL: ${{ github.event.workflow_run.html_url }}
          TARGET_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from urllib.parse import urlsplit

          def required(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  raise SystemExit(f"Missing required setting: {name}")
              return value

          base = required("FM1_URL").rstrip("/")
          parsed = urlsplit(base)
          if (
              parsed.scheme != "https"
              or not parsed.hostname
              or parsed.username is not None
              or parsed.password is not None
              or parsed.path not in ("", "/")
              or parsed.query
              or parsed.fragment
          ):
              raise SystemExit("FM1_URL must be a valid HTTPS origin")

          repo = required("TARGET_REPO")
          if repo != required("GITHUB_REPOSITORY"):
              raise SystemExit("Repository mismatch")

          run_id = required("TARGET_RUN_ID")
          attempt = required("TARGET_ATTEMPT")
          conclusion = required("TARGET_CONCLUSION")

          api = (
              f"https://api.github.com/repos/{repo}/actions/runs/"
              f"{run_id}/attempts/{attempt}/jobs?per_page=100"
          )

          request = urllib.request.Request(
              api,
              headers={
                  "Authorization": "Bearer " + required("GH_API_TOKEN"),
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "ZeroUI-ER067-Test-Reporter",
              },
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  job_data = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(
                  f"GitHub jobs lookup failed: HTTP {exc.code}"
              ) from None
          except urllib.error.URLError as exc:
              raise SystemExit(
                  f"GitHub jobs lookup unreachable: {type(exc.reason).__name__}"
              ) from None

          jobs = job_data.get("jobs")
          if not isinstance(jobs, list) or job_data.get("total_count") != 1:
              raise SystemExit("Expected exactly one required test job")

          job = jobs[0]

          if job.get("name") != "FM1 ER067 Required Test Suite":
              raise SystemExit("Unexpected CI job")

          if job.get("status") != "completed":
              raise SystemExit("CI job not completed")

          steps = [
              step for step in job.get("steps", [])
              if step.get("name") == "Run deterministic unit test"
          ]

          if len(steps) != 1:
              raise SystemExit("Required test step evidence missing")

          step_conclusion = steps[0].get("conclusion")
          job_conclusion = job.get("conclusion")

          if step_conclusion not in {"failure", "success"}:
              raise SystemExit("Unexpected test-step result")

          if job_conclusion != step_conclusion:
              raise SystemExit("Job and test-step conclusions disagree")

          expected_conclusion = (
              "failure" if step_conclusion == "failure" else "success"
          )

          if conclusion != expected_conclusion:
              raise SystemExit("Workflow conclusion mismatch")

          failed = step_conclusion == "failure"
          passed = not failed

          print("GitHub test step:", step_conclusion)
          print("GitHub job conclusion:", job_conclusion)
          print("GitHub workflow conclusion:", conclusion)

          event_id = f"github-ci-er067-{run_id}-{attempt}-{job['id']}"

          payload = {
              "required_gate": True,
              "required_tests": True,
              "workflow_completed": True,
              "workflow_failed": failed,
              "test_failed": failed,
              "tests_passed": passed,
              "scan_passed": passed,
              "workflow_conclusion": conclusion,
              "test_step_conclusion": step_conclusion,
              "failed_test_count": 1 if failed else 0,
              "workflow_run_id": run_id,
              "workflow_run_url": required("TARGET_URL"),
              "job_id": job["id"],
              "job_url": job.get("html_url"),
          }

          if passed:
              payload.update({
                  "ci_recheck": True,
                  "recheck_of_blocker_id": required("RECHECK_BLOCKER_ID"),
                  "recheck_of_normalized_event_id": required("RECHECK_EVENT_ID"),
                  "recheck_reason": "successful_followup_ci_test_run",
              })

          signal = {
              "schema_version": "1",
              "event_type_id": "ci.test.failed",
              "source_system": "ci_cd",
              "signal_method": "pipeline_job",
              "provider": "github_actions",
              "tenant_id": required("TENANT_ID"),
              "release_key": required("RELEASE_ID"),
              "release_id": required("RELEASE_ID"),
              "repository": repo,
              "branch": required("TARGET_BRANCH"),
              "commit_hash": required("TARGET_SHA"),
              "trace_id": event_id,
              "source_event_id": event_id,
              "workflow_run_id": run_id,
              "run_id": run_id,
              "pipeline_id": run_id,
              "workflow_name": required("TARGET_NAME"),
              "payload": payload,
              "raw_metadata": {
                  "ci_runner_marker": "github_actions",
                  "ci_runner_detected": True,
              },
          }

          request = urllib.request.Request(
              base + "/fm1/v1/ci/signals",
              data=json.dumps(signal).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "X-FM1-Signal-Intake-Auth-Token": required("FM1_TOKEN"),
              },
              method="POST",
          )

          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
                  print("FM1 HTTP status:", response.status)
          except urllib.error.HTTPError as exc:
              print("FM1 HTTP status:", exc.code)
              raise SystemExit("FM1 rejected the CI signal") from None
          except urllib.error.URLError as exc:
              raise SystemExit(
                  f"FM1 endpoint unreachable: {type(exc.reason).__name__}"
              ) from None

          for key in (
              "accepted",
              "ingest_status",
              "routing_status",
              "mapped_trigger_id",
              "decision_status",
              "decision_outcome",
              "normalized_event_id",
              "blocker_id",
              "receipt_ref",
              "reason_code",
          ):
              print(f"{key}: {result.get(key)}")

          if result.get("accepted") is not True:
              raise SystemExit("FM1 did not accept event")

          if result.get("mapped_trigger_id") != "ER-067":
              raise SystemExit("Incorrect ER mapping")

          if result.get("decision_status") != "decided":
              raise SystemExit("Decision incomplete")

          outcome = result.get("decision_outcome")

          if failed and outcome not in {
              "warn", "soft_block", "hard_block"
          }:
              raise SystemExit("Failed required test was incorrectly allowed")

          if passed and outcome != "pass":
              raise SystemExit("Successful test re-check did not pass")

          if not result.get("receipt_ref"):
              raise SystemExit("Missing decision receipt")

          print("ER-067 evaluation and receipt verified")
          PY
