
name: FM1 CI ER051 Completion Reporter

on:
  workflow_run:
    workflows:
      - FM1 CI ER051 Coverage Dropped Test
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  report-ci-result:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Download coverage evidence from the source run
        uses: actions/download-artifact@v4
        with:
          name: fm1-er051-coverage-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: er051-evidence

      - name: Verify measured coverage and report ER-051 to ZeroUI
        shell: bash
        env:
          FM1_URL: ${{ vars.FM1_PUBLIC_BASE_URL }}
          FM1_TOKEN: ${{ secrets.FM1_SIGNAL_INTAKE_AUTH_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TENANT_ID: ${{ vars.FM1_TENANT_ID }}
          RELEASE_ID: ${{ vars.FM1_RELEASE_ID }}
          RECHECK_BLOCKER_ID: ${{ vars.FM1_ER051_RECHECK_BLOCKER_ID }}
          RECHECK_EVENT_ID: ${{ vars.FM1_ER051_RECHECK_EVENT_ID }}
          TARGET_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TARGET_NAME: ${{ github.event.workflow_run.name }}
          TARGET_TITLE: ${{ github.event.workflow_run.display_title }}
          TARGET_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit

          def required(name):
              value = os.environ.get(name, '').strip()
              if not value:
                  raise SystemExit(f'Missing required setting: {name}')
              return value

          repo = required('TARGET_REPO')
          if repo != required('GITHUB_REPOSITORY'):
              raise SystemExit('GitHub source repository mismatch')
          run_id = required('TARGET_RUN_ID')
          attempt = required('TARGET_ATTEMPT')
          sha = required('TARGET_SHA')
          proof = Path('er051-evidence')
          summary = json.loads((proof / 'summary.json').read_text(encoding='utf-8'))
          if summary.get('schema') != 'zeroui.er051.coverage_fixture.v1':
              raise SystemExit('Unexpected coverage-evidence schema')
          mode = summary.get('mode')
          if mode not in ('drop', 'pass'):
              raise SystemExit('Unexpected coverage test mode')
          if summary.get('run_id') != run_id or str(summary.get('run_attempt')) != attempt:
              raise SystemExit('Coverage report belongs to another run')
          if summary.get('commit_sha') != sha:
              raise SystemExit('Coverage report commit differs from GitHub event')
          if required('TARGET_TITLE') != f'ER051 {mode} coverage fixture':
              raise SystemExit('GitHub run mode and coverage artifact disagree')

          def percent(filename):
              report = json.loads((proof / filename).read_text(encoding='utf-8'))
              totals = report['totals']
              value = float(totals['percent_covered'])
              if totals['num_statements'] <= 0 or not (0 <= value <= 100):
                  raise SystemExit('Invalid measured coverage evidence')
              return value

          baseline = percent('baseline.json')
          current = percent('current.json')
          threshold = float(summary['fixture_threshold_percent'])
          if threshold != 85.0:
              raise SystemExit('Unexpected test-fixture threshold')
          if (abs(baseline - float(summary['baseline_coverage_percent'])) > 0.01 or
                  abs(current - float(summary['current_coverage_percent'])) > 0.01):
              raise SystemExit('Coverage summary does not match the reports')
          dropped = baseline > current and current < threshold
          if mode == 'drop' and not dropped:
              raise SystemExit('No measured coverage regression')
          if mode == 'pass' and (current < threshold or abs(current - baseline) > 0.01):
              raise SystemExit('Coverage recovery was not measured')

          api = f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/attempts/{attempt}/jobs?per_page=100'
          job_request = urllib.request.Request(api, headers={
              'Authorization': 'Bearer ' + required('GH_API_TOKEN'),
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ZeroUI-ER051-Reporter',
          })
          try:
              with urllib.request.urlopen(job_request, timeout=30) as response:
                  job_data = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'GitHub job evidence lookup HTTP {exc.code}') from None
          jobs = job_data.get('jobs')
          if not isinstance(jobs, list) or job_data.get('total_count') != 1:
              raise SystemExit('Expected one source coverage job')
          job = jobs[0]
          if (job.get('name') != 'FM1 ER051 Coverage Measurement' or
                  job.get('status') != 'completed' or job.get('conclusion') != 'success'):
              raise SystemExit('Source coverage job was not successful')
          steps = {step['name']: step['conclusion'] for step in job.get('steps', [])}
          if (steps.get('Measure baseline and candidate coverage') != 'success' or
                  steps.get('Upload measured coverage evidence') != 'success'):
              raise SystemExit('Source coverage measurement or evidence upload failed')

          base = required('FM1_URL').rstrip('/')
          parsed = urlsplit(base)
          if (parsed.scheme != 'https' or not parsed.hostname or
                  parsed.username or parsed.password or parsed.path not in ('', '/') or
                  parsed.query or parsed.fragment):
              raise SystemExit('FM1_URL must be an HTTPS origin without a path')

          print('Verified GitHub run:', run_id)
          print('Baseline coverage:', baseline)
          print('Current coverage:', current)
          print('Fixture threshold (not tenant policy):', threshold)
          print('Coverage delta:', round(baseline - current, 2))
          event_id = f'github-ci-er051-{run_id}-{attempt}-{job["id"]}'
          payload = {
              'metric_type': 'coverage',
              'observed_value': round(current, 2),
              'threshold': threshold,
              'baseline': round(baseline, 2),
              'coverage_percent': round(current, 2),
              'current_coverage_percent': round(current, 2),
              'required_coverage_percent': threshold,
              'baseline_coverage_percent': round(baseline, 2),
              'coverage_drop_percent': round(max(0, baseline - current), 2),
              'coverage_dropped': dropped,
              'coverage_tool': 'coverage.py',
              'coverage_report_format': 'coverage-json',
              'coverage_scope': 'controlled_python_fixture',
              'quality_gate': 'required_coverage_gate',
              'required_gate': True,
              'tests_passed': True,
              'test_failure_count': 0,
              'scan_passed': not dropped,
              'workflow_completed': True,
              'workflow_run_id': run_id,
              'workflow_run_url': required('TARGET_URL'),
              'job_id': job['id'],
              'job_url': job.get('html_url'),
          }
          if mode == 'pass':
              payload.update({
                  'ci_recheck': True,
                  'recheck_of_blocker_id': required('RECHECK_BLOCKER_ID'),
                  'recheck_of_normalized_event_id': required('RECHECK_EVENT_ID'),
                  'recheck_reason': 'measured_coverage_recovery',
              })

          signal = {
              'schema_version': '1',
              'event_type_id': 'ci.coverage.dropped',
              'source_system': 'ci_cd',
              'signal_method': 'pipeline_job',
              'provider': 'github_actions',
              'tenant_id': required('TENANT_ID'),
              'release_key': required('RELEASE_ID'),
              'release_id': required('RELEASE_ID'),
              'repository': repo,
              'branch': required('TARGET_BRANCH'),
              'commit_hash': sha,
              'trace_id': event_id,
              'source_event_id': event_id,
              'workflow_run_id': run_id,
              'run_id': run_id,
              'pipeline_id': run_id,
              'workflow_name': required('TARGET_NAME'),
              'payload': payload,
              'raw_metadata': {
                  'ci_runner_marker': 'github_actions',
                  'ci_runner_detected': True,
              },
          }
          request = urllib.request.Request(
              base + '/fm1/v1/ci/signals',
              data=json.dumps(signal).encode('utf-8'),
              headers={
                  'Content-Type': 'application/json',
                  'X-FM1-Signal-Intake-Auth-Token': required('FM1_TOKEN'),
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
                  print('FM1 HTTP status:', response.status)
          except urllib.error.HTTPError as exc:
              print('FM1 HTTP status:', exc.code)
              raise SystemExit('FM1 rejected ER-051 signal') from None
          except urllib.error.URLError as exc:
              raise SystemExit(f'FM1 endpoint unreachable: {type(exc.reason).__name__}') from None

          for key in (
              'accepted', 'ingest_status', 'routing_status', 'mapped_trigger_id',
              'decision_status', 'decision_outcome', 'normalized_event_id',
              'blocker_id', 'receipt_ref', 'reason_code',
          ):
              print(f'{key}: {result.get(key)}')
          if result.get('accepted') is not True or result.get('mapped_trigger_id') != 'ER-051':
              raise SystemExit('Incorrect ER-051 intake or mapping')
          if result.get('decision_status') != 'decided' or not result.get('receipt_ref'):
              raise SystemExit('Missing decision or receipt')
          outcome = result.get('decision_outcome')
          if mode == 'drop' and outcome == 'pass':
              raise SystemExit('Coverage regression returned pass; inspect active F13 policy before certifying')
          if mode == 'pass' and outcome != 'pass':
              raise SystemExit('Coverage recovery did not pass under F13 policy')
          print('ER-051 decision and receipt verified; inspect blocker state in portal')
          PY
