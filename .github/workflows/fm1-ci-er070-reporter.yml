
name: FM1 CI ER070 Completion Reporter

on:
  workflow_run:
    workflows:
      - FM1 CI ER070 Artifact Build Test
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  report-ci-result:
    if: >-
      ${{
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Download artifact build evidence
        uses: actions/download-artifact@v4
        with:
          name: fm1-er070-build-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: er070-evidence

      - name: Verify build evidence and report ER-070 to ZeroUI
        shell: bash
        env:
          FM1_URL: ${{ vars.FM1_PUBLIC_BASE_URL }}
          FM1_TOKEN: ${{ secrets.FM1_SIGNAL_INTAKE_AUTH_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TENANT_ID: ${{ vars.FM1_TENANT_ID }}
          RELEASE_ID: ${{ vars.FM1_RELEASE_ID }}
          RECHECK_BLOCKER_ID: ${{ vars.FM1_ER070_RECHECK_BLOCKER_ID }}
          RECHECK_EVENT_ID: ${{ vars.FM1_ER070_RECHECK_EVENT_ID }}
          TARGET_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TARGET_NAME: ${{ github.event.workflow_run.name }}
          TARGET_TITLE: ${{ github.event.workflow_run.display_title }}
          TARGET_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import urllib.error
          import urllib.request
          import zipfile
          from email.parser import Parser
          from pathlib import Path
          from urllib.parse import urlsplit

          def required(key):
              value = os.environ.get(key, '').strip()
              if not value:
                  raise SystemExit(f'Missing required setting: {key}')
              return value

          repo = required('TARGET_REPO')
          if repo != required('GITHUB_REPOSITORY'):
              raise SystemExit('Unexpected source repository')
          run_id = required('TARGET_RUN_ID')
          attempt = required('TARGET_ATTEMPT')
          sha = required('TARGET_SHA')
          proof = Path('er070-evidence')
          summary = json.loads((proof / 'summary.json').read_text(encoding='utf-8'))
          log = (proof / 'build.log').read_text(encoding='utf-8')
          pyproject = proof / 'package' / 'pyproject.toml'
          source = proof / 'package' / 'src' / 'fm1_er070_fixture' / '__init__.py'
          wheel_dir = proof / 'dist'
          wheels = sorted(wheel_dir.glob('*.whl')) if wheel_dir.is_dir() else []
          expected_wheel = 'fm1_er070_fixture-0.0.1-py3-none-any.whl'

          if summary.get('schema') != 'zeroui.er070.wheel_build_fixture.v1':
              raise SystemExit('Unexpected artifact build evidence schema')
          mode = summary.get('mode')
          if mode not in ('fail', 'pass'):
              raise SystemExit('Unexpected build mode')
          if (summary.get('run_id') != run_id or
                  str(summary.get('run_attempt')) != attempt or
                  summary.get('commit_sha') != sha or
                  required('TARGET_TITLE') != f'ER070 {mode} artifact build fixture'):
              raise SystemExit('Build evidence does not match source GitHub run')
          if (summary.get('scope') != 'controlled_python_wheel_fixture' or
                  summary.get('build_tool') != 'pip wheel' or
                  summary.get('build_family') != 'artifact_build' or
                  summary.get('check_family') != 'artifact_build' or
                  summary.get('required_gate') is not True or
                  summary.get('package_name') != 'fm1-er070-fixture' or
                  summary.get('expected_artifact_name') != expected_wheel):
              raise SystemExit('Unexpected artifact build scope or requirements')
          if (summary.get('metadata_sha256') != hashlib.sha256(pyproject.read_bytes()).hexdigest() or
                  summary.get('source_sha256') != hashlib.sha256(source.read_bytes()).hexdigest()):
              raise SystemExit('Build source metadata hash mismatch')
          if source.read_text(encoding='utf-8') != 'def answer():\n    return 42\n':
              raise SystemExit('Unexpected fixture package source')
          version = 'invalid version' if mode == 'fail' else '0.0.1'
          if (summary.get('package_version') != version or
                  f'version = "{version}"' not in pyproject.read_text(encoding='utf-8')):
              raise SystemExit('Package version evidence mismatch')
          return_code = summary.get('build_exit_code')
          if type(return_code) is not int:
              raise SystemExit('Build exit status is not an integer')
          failed = return_code != 0
          if mode == 'fail':
              if (not failed or wheels or summary.get('artifact_built') is not False or
                      summary.get('wheel_sha256') is not None or
                      summary.get('error_kind') != 'invalid_project_version' or
                      'project.version' not in log.lower() or 'pep440' not in log.lower()):
                  raise SystemExit('Actual metadata-generation failure not verified')
          else:
              if (failed or len(wheels) != 1 or wheels[0].name != expected_wheel or
                      summary.get('artifact_built') is not True or
                      summary.get('error_kind') is not None or
                      summary.get('wheel_sha256') != hashlib.sha256(wheels[0].read_bytes()).hexdigest()):
                  raise SystemExit('Successful wheel artifact evidence is invalid')
              with zipfile.ZipFile(wheels[0]) as archive:
                  names = archive.namelist()
                  metadata = [p for p in names if p.endswith('.dist-info/METADATA')]
                  if 'fm1_er070_fixture/__init__.py' not in names or len(metadata) != 1:
                      raise SystemExit('Wheel contents or metadata missing')
                  info = Parser().parsestr(archive.read(metadata[0]).decode('utf-8'))
                  if info.get('Name') != 'fm1-er070-fixture' or info.get('Version') != '0.0.1':
                      raise SystemExit('Unexpected built wheel identity')

          api = (f'https://api.github.com/repos/{repo}/actions/runs/'
                 f'{run_id}/attempts/{attempt}/jobs?per_page=100')
          jobs_request = urllib.request.Request(api, headers={
              'Authorization': 'Bearer ' + required('GH_API_TOKEN'),
              'Accept': 'application/vnd.github+json',
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'ZeroUI-ER070-Reporter',
          })
          try:
              with urllib.request.urlopen(jobs_request, timeout=30) as response:
                  job_data = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f'GitHub jobs lookup HTTP {exc.code}') from None
          except urllib.error.URLError as exc:
              raise SystemExit(f'GitHub jobs lookup failed: {type(exc.reason).__name__}') from None
          jobs = job_data.get('jobs')
          if not isinstance(jobs, list) or job_data.get('total_count') != 1:
              raise SystemExit('Expected exactly one source build job')
          job = jobs[0]
          if (job.get('name') != 'FM1 ER070 Artifact Build' or
                  job.get('status') != 'completed' or job.get('conclusion') != 'success'):
              raise SystemExit('Source build job did not complete successfully')
          steps = {step['name']: step['conclusion'] for step in job.get('steps', [])}
          if (steps.get('Install pinned packaging backend') != 'success' or
                  steps.get('Build Python wheel fixture') != 'success' or
                  steps.get('Upload artifact build evidence') != 'success'):
              raise SystemExit('Source build or evidence-upload step did not succeed')

          base = required('FM1_URL').rstrip('/')
          parsed = urlsplit(base)
          if (parsed.scheme != 'https' or not parsed.hostname or
                  parsed.username or parsed.password or parsed.path not in ('', '/') or
                  parsed.query or parsed.fragment):
              raise SystemExit('FM1_URL must be an HTTPS origin')

          print('Mode:', mode)
          print('Actual package build exit code:', return_code)
          print('Verified wheel artifact built:', not failed)
          print('Built artifact SHA-256:', summary.get('wheel_sha256'))
          event_id = f'github-ci-er070-{run_id}-{attempt}-{job["id"]}'
          payload = {
              'check_family': 'artifact_build',
              'build_family': 'artifact_build',
              'required_gate': True,
              'build_tool': 'pip wheel',
              'build_exit_code': return_code,
              'build_passed': not failed,
              'build_succeeded': not failed,
              'artifact_build_failed': failed,
              'artifact_built': not failed,
              'artifact_ref': 'python-wheel:fm1-er070-fixture@0.0.1',
              'artifact_sha256': summary.get('wheel_sha256'),
              'expected_artifact_name': expected_wheel,
              'artifact_scope': 'controlled_python_wheel_fixture',
              'build_error_kind': summary.get('error_kind'),
              'scan_passed': not failed,
              'workflow_completed': True,
              'workflow_run_id': run_id,
              'workflow_run_url': required('TARGET_URL'),
              'job_id': job['id'],
              'job_url': job.get('html_url'),
          }
          if mode == 'pass':
              payload.update({
                  'ci_recheck': True,
                  'recheck_of_blocker_id': required('RECHECK_BLOCKER_ID'),
                  'recheck_of_normalized_event_id': required('RECHECK_EVENT_ID'),
                  'recheck_reason': 'wheel_artifact_build_successfully_retried',
              })

          signal = {
              'schema_version': '1',
              'event_type_id': 'ci.artifact.build_failed',
              'source_system': 'ci_cd',
              'signal_method': 'pipeline_job',
              'provider': 'github_actions',
              'tenant_id': required('TENANT_ID'),
              'release_key': required('RELEASE_ID'),
              'release_id': required('RELEASE_ID'),
              'repository': repo,
              'branch': required('TARGET_BRANCH'),
              'commit_hash': sha,
              'trace_id': event_id,
              'source_event_id': event_id,
              'workflow_run_id': run_id,
              'run_id': run_id,
              'pipeline_id': run_id,
              'workflow_name': required('TARGET_NAME'),
              'payload': payload,
              'raw_metadata': {
                  'ci_runner_marker': 'github_actions',
                  'ci_runner_detected': True,
              },
          }
          request = urllib.request.Request(
              base + '/fm1/v1/ci/signals',
              data=json.dumps(signal).encode('utf-8'),
              headers={
                  'Content-Type': 'application/json',
                  'X-FM1-Signal-Intake-Auth-Token': required('FM1_TOKEN'),
              },
              method='POST',
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
                  print('FM1 HTTP status:', response.status)
          except urllib.error.HTTPError as exc:
              print('FM1 HTTP status:', exc.code)
              raise SystemExit('FM1 rejected ER-070 signal') from None
          except urllib.error.URLError as exc:
              raise SystemExit(f'FM1 endpoint unreachable: {type(exc.reason).__name__}') from None
          for key in (
              'accepted', 'ingest_status', 'routing_status', 'mapped_trigger_id',
              'decision_status', 'decision_outcome', 'normalized_event_id',
              'blocker_id', 'receipt_ref', 'reason_code',
          ):
              print(f'{key}: {result.get(key)}')
          if result.get('accepted') is not True or result.get('mapped_trigger_id') != 'ER-070':
              raise SystemExit('Incorrect ER-070 event intake or mapping')
          if result.get('decision_status') != 'decided' or not result.get('receipt_ref'):
              raise SystemExit('Missing F13 decision or receipt')
          outcome = result.get('decision_outcome')
          if mode == 'fail' and outcome != 'hard_block':
              raise SystemExit('Expected ER-070 hard_block not observed; inspect tenant policy')
          if mode == 'pass' and outcome != 'pass':
              raise SystemExit('Successful artifact rebuild did not pass F13 policy')
          print('ER-070 event, decision and receipt verified; check blocker in portal')
          PY
