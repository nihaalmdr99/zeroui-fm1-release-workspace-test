
name: FM1 CI ER069 Completion Reporter

on:
  workflow_run:
    workflows:
      - FM1 CI ER069 Skipped Required Gate Test
    types:
      - completed

permissions:
  contents: read
  actions: read

jobs:
  report-ci-result:
    if: >-
      ${{
        github.event.workflow_run.event == 'workflow_dispatch' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.head_repository.full_name == github.repository
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub required job and report ER-069 to ZeroUI
        shell: bash
        env:
          FM1_URL: ${{ vars.FM1_PUBLIC_BASE_URL }}
          FM1_TOKEN: ${{ secrets.FM1_SIGNAL_INTAKE_AUTH_TOKEN }}
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TENANT_ID: ${{ vars.FM1_TENANT_ID }}
          RELEASE_ID: ${{ vars.FM1_RELEASE_ID }}
          RECHECK_BLOCKER_ID: ${{ vars.FM1_ER069_RECHECK_BLOCKER_ID }}
          RECHECK_EVENT_ID: ${{ vars.FM1_ER069_RECHECK_EVENT_ID }}
          TARGET_REPO: ${{ github.event.workflow_run.head_repository.full_name }}
          TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
          TARGET_RUN_ID: ${{ github.event.workflow_run.id }}
          TARGET_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          TARGET_NAME: ${{ github.event.workflow_run.name }}
          TARGET_URL: ${{ github.event.workflow_run.html_url }}
          TARGET_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from urllib.parse import urlsplit

          def required(name):
              value = os.environ.get(name, "").strip()
              if not value:
                  raise SystemExit(f"Missing required setting: {name}")
              return value

          repo = required("TARGET_REPO")
          if repo != required("GITHUB_REPOSITORY"):
              raise SystemExit("Workflow repository mismatch")
          run_id = required("TARGET_RUN_ID")
          attempt = required("TARGET_ATTEMPT")
          conclusion = required("TARGET_CONCLUSION")
          token = required("FM1_TOKEN")
          base = required("FM1_URL").rstrip("/")
          parsed = urlsplit(base)
          if (parsed.scheme != "https" or not parsed.hostname or
                  parsed.username is not None or parsed.password is not None or
                  parsed.path not in ("", "/") or parsed.query or parsed.fragment):
              raise SystemExit("FM1_URL must be a public HTTPS origin without a path or credentials")

          api = (
              f"https://api.github.com/repos/{repo}/actions/runs/"
              f"{run_id}/attempts/{attempt}/jobs?per_page=100"
          )
          api_request = urllib.request.Request(
              api,
              headers={
                  "Authorization": "Bearer " + required("GH_API_TOKEN"),
                  "Accept": "application/vnd.github+json",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "User-Agent": "ZeroUI-ER069-Real-Job-Evidence",
              },
          )
          try:
              with urllib.request.urlopen(api_request, timeout=30) as response:
                  jobs_response = json.load(response)
          except urllib.error.HTTPError as exc:
              raise SystemExit(f"GitHub jobs lookup HTTP {exc.code}; signal not sent") from None
          except urllib.error.URLError as exc:
              raise SystemExit(f"GitHub jobs lookup unreachable ({type(exc.reason).__name__}); signal not sent") from None

          jobs = jobs_response.get("jobs")
          if not isinstance(jobs, list) or jobs_response.get("total_count") != 1:
              raise SystemExit("Expected exactly one job in source workflow; signal not sent")
          gate = jobs[0]
          if gate.get("name") != "FM1 ER069 Required CI Gate":
              raise SystemExit("Unexpected source job identity; signal not sent")
          gate_conclusion = gate.get("conclusion")
          if gate.get("status") != "completed" or gate_conclusion not in ("skipped", "success"):
              raise SystemExit("Required job has an unsupported terminal state; signal not sent")
          skipped = gate_conclusion == "skipped"
          passed = gate_conclusion == "success"
          if passed and conclusion != "success":
              raise SystemExit("Workflow and required-job conclusions disagree; signal not sent")
          if skipped and conclusion not in ("success", "skipped"):
              raise SystemExit("Unexpected overall workflow conclusion; signal not sent")

          print("GitHub overall workflow conclusion:", conclusion)
          print("GitHub required job conclusion:", gate_conclusion)
          print("GitHub job ID:", gate.get("id"))
          print("GitHub job URL:", gate.get("html_url"))

          event_id = f"github-ci-er069-{run_id}-{attempt}-{gate['id']}"
          payload = {
              "required_gate": True,
              "workflow_completed": True,
              "workflow_skipped": skipped,
              "workflow_passed": passed,
              "workflow_conclusion": conclusion,
              "required_gate_job_conclusion": gate_conclusion,
              "required_gate_job_id": gate["id"],
              "required_gate_job_url": gate.get("html_url"),
              "scan_passed": passed,
              "workflow_run_id": run_id,
              "workflow_run_url": required("TARGET_URL"),
          }
          if passed:
              payload.update({
                  "ci_recheck": True,
                  "recheck_of_blocker_id": required("RECHECK_BLOCKER_ID"),
                  "recheck_of_normalized_event_id": required("RECHECK_EVENT_ID"),
                  "recheck_reason": "successful_followup_required_ci_gate",
              })

          signal = {
              "schema_version": "1",
              "event_type_id": "ci.workflow.skipped",
              "source_system": "ci_cd",
              "signal_method": "pipeline_job",
              "provider": "github_actions",
              "tenant_id": required("TENANT_ID"),
              "release_key": required("RELEASE_ID"),
              "release_id": required("RELEASE_ID"),
              "repository": repo,
              "branch": required("TARGET_BRANCH"),
              "commit_hash": required("TARGET_SHA"),
              "trace_id": event_id,
              "source_event_id": event_id,
              "workflow_run_id": run_id,
              "run_id": run_id,
              "pipeline_id": run_id,
              "workflow_name": required("TARGET_NAME"),
              "payload": payload,
              "raw_metadata": {
                  "ci_runner_marker": "github_actions",
                  "ci_runner_detected": True,
              },
          }
          request = urllib.request.Request(
              base + "/fm1/v1/ci/signals",
              data=json.dumps(signal).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "X-FM1-Signal-Intake-Auth-Token": token,
              },
              method="POST",
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  result = json.load(response)
                  print("FM1 HTTP status:", response.status)
          except urllib.error.HTTPError as exc:
              print("FM1 HTTP status:", exc.code)
              raise SystemExit("FM1 signal rejected; inspect backend logs") from None
          except urllib.error.URLError as exc:
              raise SystemExit(f"FM1 endpoint unreachable ({type(exc.reason).__name__})") from None

          for key in (
              "accepted", "ingest_status", "routing_status", "mapped_trigger_id",
              "decision_status", "decision_outcome", "normalized_event_id",
              "blocker_id", "receipt_ref", "reason_code",
          ):
              print(f"{key}: {result.get(key)}")
          if result.get("accepted") is not True:
              raise SystemExit("FM1 did not accept the event")
          if result.get("mapped_trigger_id") != "ER-069":
              raise SystemExit("ER mapping was not ER-069")
          if result.get("decision_status") != "decided":
              raise SystemExit("FM1 decision incomplete")
          outcome = result.get("decision_outcome")
          if skipped and outcome not in ("soft_block", "hard_block"):
              raise SystemExit("Required skipped gate was not blocked")
          if passed and outcome != "pass":
              raise SystemExit("Successful required-gate re-check did not pass")
          if not result.get("receipt_ref"):
              raise SystemExit("Missing decision receipt")
          print("ER-069 decision and receipt verified; verify blocker state in portal")
          PY
